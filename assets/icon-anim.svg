<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>EasyTier CF Relay 图标演化动画</title>
  <style>
      @keyframes t1-1{0%{opacity:0}16.092%{opacity:1}100%{opacity:1}}
      @keyframes t1-2{0%{transform:scale(.94)}16.092%{transform:scale(1)}100%{transform:scale(1)}}
      @keyframes t2-1{0%{opacity:0}12.6437%{opacity:0}34.4828%{opacity:1}100%{opacity:1}}
      @keyframes t2-2{0%{transform:translateY(170px)}12.6437%{transform:translateY(170px)}34.4828%{transform:translateY(0px)}100%{transform:translateY(0px)}}
      @keyframes t3-1{0%{opacity:0}33.3333%{opacity:0}52.8736%{opacity:1}100%{opacity:1}}
      @keyframes t3-2{0%{transform:translateY(-210px)}33.3333%{transform:translateY(-210px)}52.8736%{transform:translateY(0px)}100%{transform:translateY(0px)}}
      @keyframes t4-1{0%{opacity:0}51.7241%{opacity:0}66.6667%{opacity:1}100%{opacity:1}}
      @keyframes t4-2{0%{transform:translateY(14px)}51.7241%{transform:translateY(14px)}66.6667%{transform:translateY(0px)}100%{transform:translateY(0px)}}
      @keyframes t5-1{0%{opacity:0}51.7241%{opacity:0}66.6667%{opacity:1}100%{opacity:1}}
      @keyframes t5-2{0%{transform:translateY(14px)}51.7241%{transform:translateY(14px)}66.6667%{transform:translateY(0px)}100%{transform:translateY(0px)}}
      @keyframes t6-1{0%{stroke-dashoffset:232.94}65.5172%{stroke-dashoffset:232.94}82.7586%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
      @keyframes t7-1{0%{stroke-dashoffset:232.94}65.5172%{stroke-dashoffset:232.94}82.7586%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
      @keyframes t8-1{0%{stroke-dashoffset:116}81.6092%{stroke-dashoffset:116}98.8506%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
      @keyframes t9-1{0%{stroke-dashoffset:116}81.6092%{stroke-dashoffset:116}98.8506%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}

      #anim-ring{animation:t1-1 4.35s cubic-bezier(.2,.8,.3,1) 1 both,t1-2 4.35s cubic-bezier(.2,.8,.3,1) 1 both}
      #anim-cloud{animation:t2-1 4.35s cubic-bezier(.2,.75,.25,1) 1 both,t2-2 4.35s cubic-bezier(.2,.75,.25,1) 1 both}
      #anim-server .a-drop{animation:t3-1 4.35s cubic-bezier(.3,1.06,.45,1) 1 both,t3-2 4.35s cubic-bezier(.3,1.06,.45,1) 1 both}
      #anim-user-left{animation:t4-1 4.35s ease-out 1 both,t4-2 4.35s ease-out 1 both}
      #anim-user-right{animation:t5-1 4.35s ease-out 1 both,t5-2 4.35s ease-out 1 both}
      #rv-diag-left{animation:t6-1 4.35s cubic-bezier(.35,.7,.35,1) 1 both}
      #rv-diag-right{animation:t7-1 4.35s cubic-bezier(.35,.7,.35,1) 1 both}
      #rv-bottom-left{animation:t8-1 4.35s cubic-bezier(.35,.7,.35,1) 1 both}
      #rv-bottom-right{animation:t9-1 4.35s cubic-bezier(.35,.7,.35,1) 1 both}
  </style>
  <defs>
    <!-- ===== 云：整朵轮廓。只定义形状、不写 fill，方便 <use> 换色 ===== -->
    <path id="cf-cloud" d="M219,247
      A38,38 0 1 1 219.5,171
      A46,46 0 0 1 297.4,178.9
      A34,34 0 0 1 297,247 Z"/>

    <!-- 主橙 / 浅橙之间的分色间隙（黑色 = 抠掉，露出背景） -->
    <mask id="cloud-tone" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <polygon points="270,251 296,147 304,147 278,251" fill="#000"/>
    </mask>

    <!-- 浅橙片范围（斜切线的右侧） -->
    <clipPath id="cloud-light-region" clipPathUnits="userSpaceOnUse">
      <polygon points="270,251 296,147 340,147 340,251"/>
    </clipPath>

    <!-- 云在服务器上挖出的透明间隙：黑色 = 云的轮廓向外扩 stroke-width/2 -->
    <mask id="cloud-halo" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#cf-cloud" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    </mask>

    <!-- ===== 用户（EasyTier 官方风格）：头 + 圆顶肩，锚点 = 肩底中点 ===== -->
    <g id="et-user">
      <path d="M-38,0 A38,38 0 0 1 38,0 Z"
            fill="none" stroke="#6699FF" stroke-width="13" stroke-linejoin="round"/>
      <circle cx="0" cy="-46" r="20" fill="#9BC9FF" stroke="#6699FF" stroke-width="12"/>
    </g>

    <!-- ===== 服务器机身（正面 2U 机架）===== -->
    <g id="server-unit">
      <rect x="-66" y="-45" width="132" height="90" rx="14"
            fill="#9BC9FF" stroke="#6699FF" stroke-width="12"/>
      <!-- 中分线 -->
      <line x1="-54" y1="-16" x2="54" y2="-16" stroke="#6699FF" stroke-width="7" stroke-linecap="round"/>
      <!-- 上 1U：盘位槽 + 两颗指示灯 -->
      <rect x="-46" y="-36" width="52" height="16" rx="8"
            fill="none" stroke="#6699FF" stroke-width="7"/>
      <circle cx="30" cy="-28" r="5.5" fill="#6699FF"/>
      <circle cx="47" cy="-28" r="5.5" fill="#6699FF"/>
      <!-- 下 1U -->
      <rect x="-46" y="-12" width="52" height="16" rx="8"
            fill="none" stroke="#6699FF" stroke-width="7"/>
      <circle cx="30" cy="-4" r="5.5" fill="#6699FF"/>
      <circle cx="47" cy="-4" r="5.5" fill="#6699FF"/>
    </g>
  
  <!-- ===== 1. 外圈大圆环 ===== -->
  <g id="ring">
    <circle cx="256" cy="256" r="224" fill="none" stroke="#6699FF" stroke-width="18"/>
  </g>

  <!-- ===== 2. 中心连线（不要就删掉这一组）===== -->
  <g id="links" fill="none" stroke="#6699FF" stroke-width="9" stroke-linecap="round"
     stroke-dasharray="18 14" stroke-opacity=".55">
    <path d="M140,339 L256,137 L372,339 Z"/>
  </g>

  <!-- ===== 3. 三个节点（整体微调可给下面的 <g> 加 transform，如 translate(0,-8) 整体上移 8）===== -->
  <g id="nodes">

    <!-- 3a. 顶部：服务器（mask 让云把它"咬"掉一块）
         注意：mask 与 transform 不能写在同一个元素上——mask 内容按引用元素的用户坐标系解析，
         所以外层 <g> 只挂 mask，位移放到内层 <g>。改服务器位置改下面这行 translate。 -->
    <g id="server" mask="url(#cloud-halo)">
      <g transform="translate(256,137)">
        <use href="#server-unit"/>
      </g>
    </g>

    <!-- 3b. 左下、右下：两个用户（同一个定义复用两次）-->
    <g id="user-left">
      <use href="#et-user" x="140" y="385"/>
    </g>
    <g id="user-right">
      <use href="#et-user" x="372" y="385"/>
    </g>

  </g>

  <!-- ===== 4. 云（最上层，前置遮挡服务器）===== -->
  <g id="cloud">
    <g mask="url(#cloud-tone)">
      <use href="#cf-cloud" fill="#F58220"/>
      <use href="#cf-cloud" fill="#FBAE40" clip-path="url(#cloud-light-region)"/>
    </g>
  </g>
  <mask id="link-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#000"/>
      <line id="rv-diag-left" x1="140" y1="339" x2="256" y2="137" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="232.94 232.94" stroke-dashoffset="232.94"/>
      <line id="rv-diag-right" x1="372" y1="339" x2="256" y2="137" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="232.94 232.94" stroke-dashoffset="232.94"/>
      <line id="rv-bottom-left" x1="140" y1="339" x2="256" y2="339" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="116 116" stroke-dashoffset="116"/>
      <line id="rv-bottom-right" x1="372" y1="339" x2="256" y2="339" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="116 116" stroke-dashoffset="116"/>
    </mask>
  </defs>
  <g id="anim-ring"><use href="#ring"/></g>
  <g id="anim-links" mask="url(#link-reveal)"><use href="#links"/></g>
      <g id="anim-server" mask="url(#cloud-halo)">
        <g class="a-drop">
          <g transform="translate(256,137)">
            <use href="#server-unit"/>
          </g>
        </g>
      </g>
  <g id="anim-user-left"><use href="#user-left"/></g>
  <g id="anim-user-right"><use href="#user-right"/></g>
  <g id="anim-cloud"><use href="#cloud"/></g>
</svg>
